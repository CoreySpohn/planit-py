[build-system]
requires = ['hatchling', "hatch-fancy-pypi-readme", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "planit-py"
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
description = "A Python library to plan exoplanet observations."
dependencies = ["equinox>=0.13.2", "jax>=0.8.1", "jaxlib>=0.8.1"]
license = { file = "LICENSE" }
dynamic = ['readme', 'version']
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Homepage = "https://github.com/CoreySpohn/planit-py"
Issues = "https://github.com/CoreySpohn/planit-py/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/planit_py/_version.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[project.optional-dependencies]
dev = ["pre-commit"]
test = [
  "pytest>=7.3.2",
  "pytest-xdist>=2.5",
  "pytest-timeout>=1.3.1",
  "pytest-fail-slow>=0.1.0",
]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF", "NPY"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # test functions / fixtures do not need docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.hatch.build.targets.wheel]
packages = ["src/planit_py"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests", "/.github"]

[tool.pytest.ini_options]
filterwarnings = ["error"]
markers = [
  "medium: tests with a 30-second default time budget",
  "slow: tests with a 300-second default time budget, run nightly",
]

[tool.deptry]
known_first_party = ["planit_py"]
optional_dependencies_dev_groups = ["dev", "test"]

[tool.deptry.per_rule_ignores]
# JAX loads its compiled backend; keep the explicit minimum version constraint.
DEP002 = ["jaxlib"]

[tool.ty.src]
include = ["src/planit_py"]
